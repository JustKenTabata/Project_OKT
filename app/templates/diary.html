<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diary Entries</title>
    <style>
        .entry-header {
            background-color: #eee;
            padding: 10px;
            cursor: pointer;
            margin-bottom: 5px;
            border-radius: 5px;
        }
        .entry-content {
            display: none;
            padding: 10px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
            border-left: 4px solid #ccc;
        }
        video {
            max-width: 600px;
            width: 100%;
            height: auto;
            display: block;
            margin-top: 10px;
        }

        .top-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <h1>Diary Entries</h1>

    <div class="top-buttons">
        <a href="{{ url_for('main.upload') }}">
            <button>Upload New Video</button>
        </a>

        <form action="{{ url_for('main.logout') }}" method="get">
            <button type="submit">Logout</button>
        </form>
    </div>


    {% for video in videos %}
        <div class="entry">
            <div class="entry-header" onclick="toggleEntry('{{ video.id }}')">
                {{ video.timestamp.strftime('%Y-%m-%d %H:%M')}}
            </div>
            <div class="entry-content" id="entry-{{ video.id }}">
                <video controls>
                    <source src="{{url_for('static', filename='uploads/' ~ video.filename)}}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <p>{{ video.description }}</p>
            </div>
        </div>
    {% endfor %}


    <script>
        function toggleEntry(id) {
            const content = document.getElementById('entry-' + id);
            if (content.style.display === 'none' || content.style.display === '') {
                content.style.display = 'block';
            } else {
                content.style.display = 'none';
            }
        }
    </script>
</body>
</html>
